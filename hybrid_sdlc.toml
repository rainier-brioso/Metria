selected_model = "qwen3.8-flash-next-coder-iq1_m"
max_retries = 2
task_timeout_seconds = 600
attempt_timeout_seconds = 180
aider_max_tokens = 4096
aider_reasoning_budget_tokens = 1024

[[server_candidates]]
url = "http://127.0.0.1:8080/v1"

[command_profiles.weight_json_android_offline]
argv = [
  "powershell.exe",
  "-NoProfile",
  "-Command",
  "$env:ANDROID_HOME = Join-Path $env:LOCALAPPDATA 'Android\\Sdk'; $env:GRADLE_USER_HOME = Join-Path $env:USERPROFILE '.gradle'; & '.\\gradlew.bat' --offline :app:testDebugUnitTest :app:assembleDebug --no-daemon"
]
cwd = "native-android"
timeout_seconds = 1800
env_allowlist = ["LOCALAPPDATA", "USERPROFILE", "PATH", "JAVA_HOME"]
